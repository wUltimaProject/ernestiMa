[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucp-estimation-backend"
version = "1.0.0"
description = "Backend API for software project estimation using UCP method"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "alembic==1.12.1",
    "mangum==0.17.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
